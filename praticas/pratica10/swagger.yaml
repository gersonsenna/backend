openapi: 3.0.0

info:
  title: Minha API REST
  version: 1.0.0

servers:
  - url: http://localhost:3000/

tags:
  - name: usuarios
    description: Operações relacionadas a usuários

paths:

  /usuarios:
    post:
      tags:
        - usuarios
      summary: Cria um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                senha:
                  type: string
      responses:
        201:
          description: Usuário criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  email:
                    type: string
        422:
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensagem"

  /usuarios/renovar:
    post:
      tags:
        - usuarios
      summary: Renova o token JWT
      security:
        - JWTAuth: []
      responses:
        200:
          description: Token renovado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        401:
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensagem"

  /usuarios/{id}:
    delete:
      tags:
        - usuarios
      summary: Remove um usuário pelo ID
      security:
        - JWTAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário
          schema:
            type: string
      responses:
        204:
          description: Usuário removido com sucesso
        401:
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensagem"

components:

  schemas:
    Mensagem:
      type: object
      properties:
        msg:
          type: string

  securitySchemes:
    JWTAuth:
      type: apiKey
      in: header
      name: authorization
      description: "Informe o token JWT. Ex: token123"
